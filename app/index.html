    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

         websites" does not recolour it. Kept in step with the chosen theme. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="description" content="Tick your habits each day and watch your fire charts fill in." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Firechart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Firechart</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
