name: keep-alive

# Supabase pauses free projects after about a week without database activity.
# This asks the database for a heartbeat once a day so a quiet week does not
# pause it. The address and key are the app's public ones.
#
# GitHub switches scheduled workflows off after 60 days without any activity
# in the repository and emails the owner; re-enable it from the Actions tab.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for a heartbeat
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: https://dbhfompibgaphwiuqvgi.supabase.co
          SUPABASE_KEY: sb_publishable_dSnkpqcasi_hL_I9HczT2A_tCzRbrTW
